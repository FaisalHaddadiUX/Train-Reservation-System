<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Reservation System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; direction: ltr; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #results, #message { margin-top: 20px; font-weight: bold; }
        .train-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Search & Book Trains</h2>
    
    <div class="form-group">
        <button onclick="loadTrains()">Show Available Trains</button>
    </div>
    
    <div id="results"></div>

    <hr>

    <h3>Book a Ticket</h3>
    <div class="form-group">
        <label>Select Train ID:</label>
        <input type="text" id="trainID" placeholder="e.g. TR-01" required>
    </div>
    <div class="form-group">
        <label>Passenger ID:</label>
        <input type="text" id="passengerID" placeholder="e.g. SA-01" required>
    </div>
    <div class="form-group">
        <label>Passenger Name:</label>
        <input type="text" id="name" placeholder="e.g. Faisal" required>
    </div>
    <div class="form-group">
        <label>Contact Number:</label>
        <input type="text" id="contact" placeholder="e.g. 0500000000" required>
    </div>
    <button onclick="bookTicket()">Confirm Booking</button>

    <div id="message"></div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    async function loadTrains() {
        const response = await fetch(`${API_URL}/trains`);
        const trains = await response.json();
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';
        
        trains.forEach(train => {
            resultsDiv.innerHTML += `
                <div class="train-card">
                    <strong>Train ID:</strong> ${train.trainID} | <strong>Name:</strong> ${train.trainName} <br>
                    <strong>Route:</strong> ${train.departureStation} -> ${train.arrivalStation} <br>
                    <strong>Available Seats:</strong> ${train.availableSeats} | <strong>Price:</strong> ${train.price} SAR
                </div>
            `;
        });
    }

    async function bookTicket() {
        const trainID = document.getElementById('trainID').value;
        const passengerID = document.getElementById('passengerID').value;
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value;

        const response = await fetch(`${API_URL}/book`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trainID, passengerID, name, contactNumber: contact })
        });

        const result = await response.json();
        const msgDiv = document.getElementById('message');
        
        if (response.ok) {
            msgDiv.style.color = 'green';
            msgDiv.innerText = `${result.message} Your Ticket Number is: ${result.ticketNumber}`;
            loadTrains(); // تحديث قائمة القطارات لتعكس المقاعد المتبقية
        } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = result.message || result.error;
        }
    }
</script>

</body>
</html>
