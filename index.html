<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Reservation System | Luxury Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #8e8e8e;
            --accent: #d4af37; /* لون ذهبي فخم للمسات البسيطة */
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f0f0f0 100%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.5s ease;
        }

        /* تنسيق العناوين */
        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--primary);
        }
        p.subtitle {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* تنسيق الحقول */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1em;
            background-color: #fafafa;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        /* الأزرار الفخمة */
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        button.outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-top: 15px;
        }

        button.outline:hover {
            background-color: var(--primary);
            color: #fff;
        }

        /* قسم الحجز مخفي بالبداية */
        #booking-section {
            display: none;
            max-width: 700px;
        }

        /* كروت القطارات */
        .train-card {
            border: 1px solid #eaeaea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .train-card:hover {
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1);
        }
        .train-info h4 { margin: 0 0 5px 0; color: var(--primary); }
        .train-info p { margin: 0; color: var(--secondary); font-size: 0.9em; }
        .price-tag {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.2em;
        }

        /* رسائل النظام */
        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .msg-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .msg-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>Staff Portal</h2>
        <p class="subtitle">Secure Access to Train Management</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Staff Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Secure Login</button>
        </form>
    </div>

    <div class="container" id="booking-section">
        <h2>Reservation System</h2>
        <p class="subtitle">Book tickets for passengers efficiently</p>
        
        <div id="results">
            </div>

        <button class="outline" onclick="loadTrains()">Refresh Available Trains</button>

        <hr style="border: none; border-top: 1px solid #eaeaea; margin: 30px 0;">

        <form id="bookingForm" onsubmit="bookTicket(event)">
            <div class="form-group">
                <label>Train ID</label>
                <input type="text" id="trainID" placeholder="e.g. TR-01" required>
            </div>
            
            <div class="form-group">
                <label>Passenger Name (Letters only)</label>
                <input type="text" id="name" pattern="[A-Za-z\u0600-\u06FF\s]+" title="Please enter a valid name (letters only)" placeholder="e.g. Faisal" required>
            </div>

            <div class="form-group">
                <label>Passenger ID</label>
                <input type="text" id="passengerID" minlength="4" placeholder="e.g. SA-01" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" id="contact" pattern="05[0-9]{8}" title="Must be 10 digits starting with 05" placeholder="e.g. 05XXXXXXXX" required>
            </div>

            <button type="submit">Confirm & Issue Ticket</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        // الرابط الخاص بالسيرفر (بدون تغيير)
        // ⚠️ مهم: إذا كان الباك إند حقك مرفوع على ريندر، ضع الرابط هنا بدل localhost
        // مثال: const API_URL = 'https://train-reservation-system-6xaq.onrender.com/api';
        const API_URL = '/api'; 

        // دالة تسجيل الدخول (واجهة تفاعلية للانتقال لصفحة الحجز)
        function handleLogin(event) {
            event.preventDefault(); // منع تحديث الصفحة
            
            // بما أنه First Release، بنسوي انتقال مباشر كأن الموظف سجل دخول بنجاح
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('booking-section').style.display = 'block';
            
            // تحميل القطارات تلقائياً أول ما تفتح صفحة الحجز
            loadTrains();
        }

        // دالة جلب القطارات من السيرفر
        async function loadTrains() {
            try {
                // نستخدم المسار النسبي عشان يشتغل على Render بدون مشاكل
                const response = await fetch(`${API_URL}/trains`);
                const trains = await response.json();
                
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
                
                if(trains.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:gray;">No trains available right now.</p>';
                    return;
                }

                trains.forEach(train => {
                    resultsDiv.innerHTML += `
                        <div class="train-card">
                            <div class="train-info">
                                <h4>${train.trainName} (${train.trainID})</h4>
                                <p>${train.departureStation} ➔ ${train.arrivalStation}</p>
                                <p><strong>Available Seats:</strong> ${train.availableSeats}</p>
                            </div>
                            <div class="price-tag">
                                ${train.price} SAR
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading trains:", error);
            }
        }

        // دالة الحجز
        async function bookTicket(event) {
            event.preventDefault(); // منع تحديث الصفحة عشان نقدر نظهر رسالة النجاح

            const trainID = document.getElementById('trainID').value;
            const passengerID = document.getElementById('passengerID').value;
            const name = document.getElementById('name').value;
            const contact = document.getElementById('contact').value;
            const msgDiv = document.getElementById('message');

            msgDiv.style.display = 'none'; // إخفاء الرسالة السابقة

            try {
                const response = await fetch(`${API_URL}/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trainID, passengerID, name, contactNumber: contact })
                });

                const result = await response.json();
                
                msgDiv.style.display = 'block';
                if (response.ok) {
                    msgDiv.className = 'msg-success';
                    msgDiv.innerHTML = `✅ ${result.message}<br>Ticket ID: <strong>${result.ticketNumber}</strong>`;
                    document.getElementById('bookingForm').reset(); // تنظيف الحقول بعد الحجز
                    loadTrains(); // تحديث المقاعد
                } else {
                    msgDiv.className = 'msg-error';
                    msgDiv.innerHTML = `❌ ${result.message || result.error}`;
                }
            } catch (error) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'msg-error';
                msgDiv.innerHTML = `❌ Connection error. Please try again.`;
            }
        }
    </script>

</body>
</html>
